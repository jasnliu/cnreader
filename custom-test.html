<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNReader</title>
  <style>
    @font-face {
      font-family: 'DFFangSong';
      src: url('DFFangSong1B Regular.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: white;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #gridCanvas {
      cursor: pointer;
    }

    #siteTitle {
      position: absolute;
      left: 50%;
      top: 60px;
      transform: translate(-50%, -50%);
      font-family: 'Times New Roman', serif;
      font-size: 42px;
      line-height: 1;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }

    #selectionBar {
      position: fixed;
      top: 0;
      left: 0;
      background: black;
      pointer-events: none;
    }
    #selectionPrompt {
      position: fixed;
      font-family: 'Times New Roman', serif;
      color: white;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    #continueButton {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      color: white;
      font-family: 'Times New Roman', serif;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #backButton {
      position: fixed;
      bottom: 0;
      right: 0;
      background: black;
      color: white;
      font-family: 'Times New Roman', serif;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #navButtons {
      position: fixed;
      display: flex;
      align-items: center;
    }

    .nav-btn {
      background: black;
      color: white;
      font-family: 'Times New Roman', serif;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #popupOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #popupWindow {
      position: relative;
      background: white;
      transform-origin: center center;
    }

    #popupCloseBtn {
      position: absolute;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Times New Roman', serif;
      line-height: 1;
    }

    #popupChar {
      position: absolute;
      font-family: 'DFFangSong', serif;
      color: black;
      line-height: 1;
      pointer-events: none;
    }

    #popupPinyin {
      position: absolute;
      font-family: 'Times New Roman', serif;
      color: black;
      line-height: 1;
      pointer-events: none;
    }

    #popupDefinition {
      position: absolute;
      font-family: 'Times New Roman', serif;
      color: black;
      line-height: 1;
      pointer-events: none;
    }

    #popupExamples {
      position: absolute;
      font-family: 'Times New Roman', serif;
      color: black;
      line-height: 1.3;
      pointer-events: none;
    }

    #formatCheckboxes {
      position: fixed;
      top: 70px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: white;
      border: 2px solid black;
      z-index: 100;
    }
    .format-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .format-checkbox-box {
      width: 24px;
      height: 24px;
      border: 2px solid black;
      background: black;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .format-checkbox-box::after {
      content: '';
      display: block;
      width: 6px;
      height: 12px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-top: -2px;
    }
    .format-checkbox-box.unselected {
      background: white;
    }
    .format-checkbox-box.unselected::after {
      content: '';
    }
    .format-checkbox-label {
      font-family: 'Times New Roman', serif;
      font-size: 18px;
      color: black;
    }
  </style>
</head>
<body>
  <div id="siteTitle" aria-label="CNReader">
    <span id="siteTitleC">C</span><span id="siteTitleN">N</span><span id="siteTitleReader">Reader</span>
  </div>
  <canvas id="gridCanvas"></canvas>

  <div id="navButtons">
    <button class="nav-btn" id="navLeft">&lt;</button>
    <button class="nav-btn" id="navRight">&gt;</button>
  </div>

  <div id="popupOverlay">
    <div id="popupWindow">
      <span id="popupChar"></span>
      <span id="popupPinyin"></span>
      <div id="popupDefinition"></div>
      <div id="popupExamples"></div>
      <button id="popupCloseBtn">&#10005;</button>
    </div>
  </div>

  <div id="selectionBar"></div>
  <div id="selectionPrompt">Please select characters</div>

  <div id="formatCheckboxes">
    <div class="format-checkbox" id="mcCheckbox">
      <div class="format-checkbox-box" id="mcBox"></div>
      <span class="format-checkbox-label">Multiple choice</span>
    </div>
    <div class="format-checkbox" id="writeCheckbox">
      <div class="format-checkbox-box" id="writeBox"></div>
      <span class="format-checkbox-label">Pinyin input</span>
    </div>
    <div class="format-checkbox" id="definitionCheckbox">
      <div class="format-checkbox-box" id="definitionBox"></div>
      <span class="format-checkbox-label">Definition</span>
    </div>
    <div class="format-checkbox" id="listeningCheckbox">
      <div class="format-checkbox-box" id="listeningBox"></div>
      <span class="format-checkbox-label">Listening</span>
    </div>
  </div>

  <button id="continueButton">Continue</button>
  <button id="backButton">Back</button>

  <script src="unit-data.js?v=ten-units-2"></script>
  <script src="phrase-data.js?v=ten-units-3"></script>
  <script src="progress-backup.js?v=6"></script>
  <script src="account-sync.js?v=3"></script>
  <script src="custom-quiz-logic.js?v=definition-questions-2"></script>
  <script src="select.js?v=tab-title-1"></script>
</body>
</html>
