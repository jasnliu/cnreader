<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNReader</title>
  <style>
    @font-face {
      font-family: 'DFFangSong';
      src: url('DFFangSong1B Regular.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: white;
      overflow: hidden;
    }

    #typingInput::placeholder {
      color: #888;
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="quizCanvas"></canvas>
  <input type="text" id="typingInput" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" writingsuggestions="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" style="position: fixed; display: none; font-family: 'Times New Roman', serif; text-align: center; border: 1px solid black; outline: none; background: white; color: black;">

  <div id="missedPage" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 10000; overflow-y: auto;">
    <div id="missedTitle" style="font-family: 'Times New Roman', serif; text-align: center; padding-top: 32px; font-size: 40px;">Mistakes</div>
    <canvas id="missedCanvas"></canvas>
    <div id="missedAccuracy" style="font-family: 'Times New Roman', serif; text-align: center; margin-top: 24px; font-size: 22px;">Accuracy</div>
    <div id="missedXp" style="font-family: 'Times New Roman', serif; text-align: center; margin-top: 10px; font-size: 22px;">0 XP</div>
    <button id="okButton" style="position: fixed; bottom: 0; right: 0; background: black; color: white; font-family: 'Times New Roman', serif; border: none; cursor: pointer; border-top-left-radius: 15px; box-shadow: -4px -4px 6px rgba(0, 0, 0, 0.3);">Ok</button>
  </div>

  <script src="unit-data.js?v=ten-units-2"></script>
  <script src="word-details.js?v=dynamic-units-1"></script>
  <script src="phrase-data.js?v=ten-units-3"></script>
  <script src="phrase-quiz-logic.js?v=definition-optional-words-1"></script>
  <script src="xp-system.js?v=xp-animation-duration-1"></script>
  <script src="progress-backup.js?v=6"></script>
  <script src="account-sync.js?v=2"></script>
  <script src="quiz-engine.js?v=perfect-result-heading-1" data-quiz-mode="phrases"></script>
</body>
</html>
